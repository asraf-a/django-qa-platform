{% load static %}
<!DOCTYPE html>
<html lang="en" class="h-full bg-gray-50">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Q&A Platform{% endblock %}</title>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Project Custom Scripts -->
    <script defer src="{% static 'js/main.js' %}?v=1.4"></script>

    <!-- Alpine.js CDN -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>

    <!-- Project Custom Styles -->
    <link rel="stylesheet" href="{% static 'css/style.css' %}">

    {% block extra_head %}{% endblock %}
</head>
<body class="min-h-full flex flex-col font-sans text-gray-900 antialiased bg-gray-50">
    <!-- Top Navigation Header -->
    <header class="bg-white border-b border-gray-200 sticky top-0 z-10 shadow-xs">
        <div class="max-w-5xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <a href="{% url 'app:question_list' %}" class="flex items-center gap-2 text-indigo-600 font-bold text-lg hover:text-indigo-700 transition-colors">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-5l-5 5v-5z" />
                </svg>
                <span>Q&A Platform</span>
            </a>

            <nav class="flex items-center gap-3">
                {% if user.is_authenticated %}
                    <span class="text-xs sm:text-sm font-medium text-gray-700 bg-gray-100 px-3 py-1.5 rounded-full border border-gray-200">
                        {{ user.username }}
                    </span>
                    <form method="post" action="{% url 'app:logout' %}" class="inline">
                        {% csrf_token %}
                        <button type="submit" class="text-xs sm:text-sm font-medium text-gray-600 hover:text-red-600 transition-colors px-2 py-1 cursor-pointer">
                            Log out
                        </button>
                    </form>
                {% else %}
                    <a href="{% url 'app:login' %}" class="text-xs sm:text-sm font-medium text-gray-700 hover:text-indigo-600 transition-colors px-3 py-1.5 rounded-lg hover:bg-gray-50">
                        Log in
                    </a>
                    <a href="{% url 'app:register' %}" class="text-xs sm:text-sm font-medium text-white bg-indigo-600 hover:bg-indigo-700 transition-colors px-3.5 py-1.5 rounded-lg shadow-xs">
                        Register
                    </a>
                {% endif %}
            </nav>
        </div>
    </header>

    <div id="app" class="flex-1 flex flex-col">
        {% block content %}{% endblock %}
    </div>

    {% block extra_scripts %}{% endblock %}
</body>
</html>
