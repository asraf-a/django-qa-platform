<div class="inline-flex items-center gap-1 shrink-0" x-data="voteWidget({ action: '{% url 'app:comment_vote' comment.pk %}', upvotesCount: {{ comment.upvotes_count }}, downvotesCount: {{ comment.downvotes_count }}, userVote: {{ comment.user_vote|default:'null' }}, isComment: true })">
    <form method="post" action="{% url 'app:comment_vote' comment.pk %}" class="inline" @submit.prevent="vote(1)">
        {% csrf_token %}
        <input type="hidden" name="value" value="1">
        <button type="submit" @click.prevent="vote(1)" :disabled="loading" aria-label="Upvote comment" :aria-pressed="isUpvoted ? 'true' : 'false'" title="Like" class="inline-flex items-center gap-1 px-1.5 py-0.5 rounded text-[11px] font-medium border shadow-2xs transition-colors cursor-pointer" :class="upvoteClasses">
            <svg x-show="isUpvoted" class="w-3.5 h-3.5 text-rose-600 shrink-0" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true" {% if comment.user_vote != 1 %}style="display: none;"{% endif %}>
                <path d="M2 10.5a1.5 1.5 0 113 0v6a1.5 1.5 0 01-3 0v-6zM6 10.333v5.43a2 2 0 001.106 1.79l.05.025A4 4 0 008.943 18h5.416a2 2 0 001.962-1.608l1.2-6A2 2 0 0015.56 8H12V4a2 2 0 00-2-2 1 1 0 00-1 1v.667a4 4 0 01-.8 2.4L6.8 7.933a4 4 0 00-.8 2.4z" />
            </svg>
            <svg x-show="!isUpvoted" class="w-3.5 h-3.5 text-gray-400 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true" {% if comment.user_vote == 1 %}style="display: none;"{% endif %}>
                <path stroke-linecap="round" stroke-linejoin="round" d="M14 10h4.764a2 2 0 011.789 2.894l-3.5 7A2 2 0 0115.263 21h-4.017c-.163 0-.326-.02-.485-.06L7 20m7-10V5a2 2 0 00-2-2h-.095c-.5 0-.905.405-.905.905 0 .714-.211 1.412-.608 2.006L7 11v9m7-10h-2M7 20H5a2 2 0 01-2-2v-6a2 2 0 012-2h2.5" />
            </svg>
            <span x-text="upvotesCount">{{ comment.upvotes_count }}</span>
        </button>
    </form>
    <form method="post" action="{% url 'app:comment_vote' comment.pk %}" class="inline" @submit.prevent="vote(-1)">
        {% csrf_token %}
        <input type="hidden" name="value" value="-1">
        <button type="submit" @click.prevent="vote(-1)" :disabled="loading" aria-label="Downvote comment" :aria-pressed="isDownvoted ? 'true' : 'false'" title="Dislike" class="inline-flex items-center gap-1 px-1.5 py-0.5 rounded text-[11px] font-medium border shadow-2xs transition-colors cursor-pointer" :class="downvoteClasses">
            <svg x-show="isDownvoted" class="w-3.5 h-3.5 text-white shrink-0" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true" {% if comment.user_vote != -1 %}style="display: none;"{% endif %}>
                <path d="M18 9.5a1.5 1.5 0 11-3 0v-6a1.5 1.5 0 013 0v6zM14 9.667v-5.43a2 2 0 00-1.106-1.79l-.05-.025A4 4 0 0011.057 2H5.64a2 2 0 00-1.962 1.608l-1.2 6A2 2 0 004.44 12H8v4a2 2 0 002 2 1 1 0 001-1v-.667a4 4 0 01.8-2.4l1.4-1.866a4 4 0 00.8-2.4z" />
            </svg>
            <svg x-show="!isDownvoted" class="w-3.5 h-3.5 text-gray-400 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true" {% if comment.user_vote == -1 %}style="display: none;"{% endif %}>
                <path stroke-linecap="round" stroke-linejoin="round" d="M10 14H5.236a2 2 0 01-1.789-2.894l3.5-7A2 2 0 018.736 3h4.018a2 2 0 01.485.06l3.76 1.06m-7 10v5a2 2 0 002 2h.096c.5 0 .905-.405.905-.904 0-.715.211-1.413.608-2.008L17 13V4m-7 10h2m5-10h2a2 2 0 012 2v6a2 2 0 01-2 2h-2.5" />
            </svg>
            <span x-text="downvotesCount">{{ comment.downvotes_count }}</span>
        </button>
    </form>
</div>
